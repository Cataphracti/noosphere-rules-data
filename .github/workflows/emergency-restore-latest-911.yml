name: Emergency restore Latest to revision 911

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/emergency-restore-latest-911.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore signed stable revision 911 as Latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: rules-data-2026.07.27-911
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TARGET_TAG}" --jq '.id')
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true >/dev/null

          latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
          test "$latest_tag" = "$TARGET_TAG"

          curl -L --fail --retry 5 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json" \
            -o /tmp/latest-manifest.json
          test "$(jq -r '.channel' /tmp/latest-manifest.json)" = "stable"
          test "$(jq -r '.dataRevision' /tmp/latest-manifest.json)" = "911"
          test "$(jq -r '.dataVersion' /tmp/latest-manifest.json)" = "2026.07.27-911"
          echo "Latest restored to ${latest_tag}"
